<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>密码初始化工具</title>
</head>
<body>
  <div id="info" style="position: fixed; top: 20%; left: 50%; transform: translateX(-50%); text-align: center; font-family: sans-serif;">
    <h2>密码初始化工具</h2>
    <p>点击按钮将密码 "1026" 的哈希值存入 Firestore</p>
    <p style="color: #999;">运行一次后可以删除这个文件</p>
  </div>
  <button id="initBtn" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 18px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 8px;">
    初始化密码到 Firestore
  </button>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js'
    import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js'

    const firebaseConfig = {
      apiKey: "AIzaSyAv-N7GXjCgjZOs64VCee0AJS5MwtLVHSk",
      authDomain: "reg-board-teacher.firebaseapp.com",
      projectId: "reg-board-teacher",
      storageBucket: "reg-board-teacher.firebasestorage.app",
      messagingSenderId: "628608598753",
      appId: "1:628608598753:web:d07ba1b5efb5c6fbaa6da0"
    }

    const app = initializeApp(firebaseConfig)
    const db = getFirestore(app)

    // Hash function
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message)
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer)
      const hashArray = Array.from(new Uint8Array(hashBuffer))
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('')
      return hashHex
    }

    // Initialize password
    async function initPassword() {
      const password = '1026'
      const hash = await sha256(password)

      console.log('Password:', password)
      console.log('Hash:', hash)

      try {
        await setDoc(doc(db, 'appConfig', 'password'), {
          hash: hash,
          updatedAt: new Date().toISOString()
        })
        console.log('✅ Password hash saved to Firestore!')
        alert('密码已成功保存到 Firestore！\n\n现在可以关闭这个页面了。')
      } catch (error) {
        console.error('❌ Error saving password:', error)
        alert('保存失败：' + error.message)
      }
    }

    document.getElementById('initBtn').onclick = initPassword
  </script>
</body>
</html>
